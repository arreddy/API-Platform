server:
  port: ${PORT:3000}

spring:
  application:
    name: gateway

  cloud:
    gateway:
      # Routes are loaded dynamically from control plane — no static routes here
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
        - DedupeResponseHeader=Content-Encoding
        - RemoveResponseHeader=Transfer-Encoding
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 10

  jackson:
    serialization:
      write-dates-as-timestamps: false

app:
  control-plane-url: ${CONTROL_PLANE_URL:http://localhost:3001}
  internal-token: ${INTERNAL_TOKEN:internal-dev-token}
  route-refresh-interval-ms: 30000

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,gateway
  endpoint:
    gateway:
      enabled: true

logging:
  level:
    com.apiplatform: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
