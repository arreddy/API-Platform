name: CI / CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build-java-services:
    name: Build Java Services
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [control-plane, gateway, mock-server]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Build
        run: mvn -q package -DskipTests
        working-directory: services/${{ matrix.service }}

  test-control-plane:
    name: Integration Tests (Control Plane)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run tests
        run: mvn -q test
        working-directory: services/control-plane
        env:
          DB_HOST: localhost
          DB_NAME: api_platform_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-secret
          INTERNAL_TOKEN: test-token

  portal-build:
    name: Portal Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - run: npm ci
        working-directory: portal
      - run: npm run build
        working-directory: portal

  docker-publish:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [lint-and-build, test-control-plane, portal-build]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: control-plane
            context: services/control-plane
          - service: gateway
            context: services/gateway
          - service: mock-server
            context: services/mock-server
          - service: portal
            context: portal
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:${{ github.sha }}

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: docker-publish
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
      - name: Apply manifests
        run: kubectl apply -f k8s/
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
      - name: Update image tags
        run: |
          kubectl set image deployment/control-plane control-plane=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/control-plane:${{ github.sha }} -n api-platform
          kubectl set image deployment/gateway gateway=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/gateway:${{ github.sha }} -n api-platform
          kubectl set image deployment/mock-server mock-server=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/mock-server:${{ github.sha }} -n api-platform
        env:
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
