name: SonarQube analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: api_platform_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for blame/new-code detection

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Build and collect coverage (control-plane)
        run: mvn -q verify
        working-directory: services/control-plane
        env:
          DB_HOST: localhost
          DB_NAME: api_platform_test
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: test-secret
          INTERNAL_TOKEN: test-token

      - name: Build (gateway)
        run: mvn -q package -DskipTests
        working-directory: services/gateway

      - name: Build (mock-server)
        run: mvn -q package -DskipTests
        working-directory: services/mock-server

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=adirangareddypateel_API-Platform
            -Dsonar.sources=services/control-plane/src/main,services/gateway/src/main,services/mock-server/src/main,portal/src
            -Dsonar.tests=services/control-plane/src/test
            -Dsonar.java.binaries=services/control-plane/target/classes,services/gateway/target/classes,services/mock-server/target/classes
            -Dsonar.coverage.jacoco.xmlReportPaths=services/control-plane/target/site/jacoco/jacoco.xml
            -Dsonar.exclusions=**/target/**,**/node_modules/**,portal/dist/**
